# Deliver due reminders — the BACKUP scheduler, and the alarm (2026-11-06).
#
# The primary is cron-job.org: every 15 minutes, 08:00–21:45 Bangkok, calling
# /api/cron/reminders with the same CRON_SECRET (docs/BETA-RUNBOOK.md). This
# workflow runs on the same schedule, so reminders still go out if the
# primary stops, and it FAILS its run — GitHub then emails the repository's
# owner — when the primary has been silent for 90 minutes inside its window,
# or when reminders are overdue and nothing has been sent for a day
# (lib/reminders/scheduler.ts). vercel.json's daily cron is the last resort.
#
# Two schedulers cannot double-send: the dispatcher claims rows with
# `FOR UPDATE SKIP LOCKED` under a lease, and each message carries an
# X-Line-Retry-Key, so whichever run arrives first owns the row.
#
# GitHub disables scheduled workflows in a public repository after 60 days
# without a commit, and emails a warning first. If that email comes, re-enable
# it under Actions -> reminders, or push any commit.

name: reminders

on:
  schedule:
    # Every 15 minutes, and only 01:00–14:59 UTC — that is 08:00–21:59 in
    # Bangkok.
    #
    # The window is not arbitrary and the interval is not laziness. Both are
    # set by what the free tier costs:
    #
    #   Neon Free gives 100 CU-hours/month and suspends the database after 5
    #   minutes idle, which cannot be disabled. Every poll wakes it for about
    #   five minutes. Polling every 5 minutes around the clock keeps it awake
    #   permanently — roughly 180 CU-hours — and exhausts the month around day
    #   16. This schedule costs about 35, leaving the rest for real traffic.
    #
    #   The window matches the product: quiet hours default to 21:00–08:00 and
    #   reminders are shifted out of them, so no reminder is ever scheduled
    #   overnight. Polling at 03:00 could only ever find nothing.
    #
    # Fifteen minutes of slop on a nudge sent two hours before a deadline does
    # not matter. Losing the database for the back half of every month does.
    - cron: '*/15 1-14 * * *'
  # So a person can prove the wiring works without waiting for the schedule.
  workflow_dispatch:

# Overlapping runs would only contend for the same lease.
concurrency:
  group: reminders
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send reminders that are due
        env:
          # Read from the environment, never interpolated into the command, so
          # it cannot land in a log line or a process list.
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          BASE_URL: ${{ vars.APP_BASE_URL || 'https://www.humanmatter.work' }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET}" ]; then
            echo "::error::CRON_SECRET is not set in this repository's secrets."
            echo "Add it under Settings -> Secrets and variables -> Actions,"
            echo "with the same value as CRON_SECRET in the Vercel project."
            exit 1
          fi

          http_code=$(curl -sS -o response.json -w '%{http_code}' \
            --max-time 120 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "X-Scheduler: github" \
            "${BASE_URL%/}/api/cron/reminders")

          echo "HTTP ${http_code}"
          cat response.json
          echo

          # A wrong or missing secret answers 401, exactly as an absent
          # scheduler does — silently. Failing the job here is what turns that
          # into something visible instead of a quiet month with no reminders.
          if [ "${http_code}" != "200" ]; then
            echo "::error::Reminder dispatch failed with HTTP ${http_code}."
            exit 1
          fi

          # The run itself worked; now the alarm. Either flag fails the job,
          # and a failed scheduled run is emailed to the owner.
          if [ "$(jq -r '.scheduling.primarySilent // false' response.json)" = "true" ]; then
            echo "::error::cron-job.org has not called /api/cron/reminders for 90 minutes. Check its job history (a 401 means CRON_SECRET differs from Vercel's)."
            failed=1
          fi
          if [ "$(jq -r '.scheduling.stale // false' response.json)" = "true" ]; then
            echo "::error::Reminders are overdue and none has been sent for over a day."
            failed=1
          fi
          exit "${failed:-0}"
